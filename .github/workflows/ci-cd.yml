# Напишите здесь CI/CD пайплайн согласно заданию
name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия образа для production (тег)'
        required: false
        default: 'latest'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang-tidy ccache wrk
      - name: Configure CMake
        run: cmake -B build -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_FLAGS="-Wall -Wextra"
      - name: Build
        run: cmake --build build
      - name: Run unit tests
        run: cd build && ctest --output-on-failure
      - name: Run integration tests
        run: |
          ./build/app &
          sleep 3
          curl --retry 5 --retry-delay 2 --fail http://localhost:8080/health
          bash tests/integration_test.sh
          kill %1
      - name: Run load test
        run: |
          ./build/app &
          sleep 2
          wrk -t2 -c100 -d10s http://localhost:8080/
          kill %1
      - name: Static analysis
        run: clang-tidy src/main.cpp -- -I.

  docker-build-push:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Lowercase repo
        run: echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - name: Build and push
        run: |
          docker build -t ghcr.io/${{ env.REPO_LOWER }}:latest .
          docker push ghcr.io/${{ env.REPO_LOWER }}:latest

  deploy-staging:
    needs: docker-build-push
    runs-on: ubuntu-latest
    steps:
      - name: Lowercase repo
        run: echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - name: Run staging container
        run: |
          docker run -d --name staging-app -p 8080:8080 ghcr.io/${{ env.REPO_LOWER }}:latest
          sleep 5
          curl --retry 5 --retry-delay 2 --fail http://localhost:8080/health
      - name: Save logs
        if: always()
        run: docker logs staging-app > staging_logs.txt
      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: staging-logs
          path: staging_logs.txt
      - name: Save metrics
        run: curl -s http://localhost:8080/metrics > staging_metrics.txt
      - name: Upload metrics
        uses: actions/upload-artifact@v4
        with:
          name: staging-metrics
          path: staging_metrics.txt

  notification:
    if: always()
    needs: [build-and-test, docker-build-push, deploy-staging]
    runs-on: ubuntu-latest
    steps:
      - name: Create report
        run: |
          echo "Report" > report.txt
          echo "Repository: ${{ github.repository }}" >> report.txt
          echo "Run: ${{ github.run_number }}" >> report.txt
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: notification-report
          path: report.txt
